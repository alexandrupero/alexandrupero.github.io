version: 2
updates:
  # Fetch and update latest `github-actions` packages
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 10
    reviewers:
      - alexandrupero
    assignees:
      - alexandrupero
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  # Fetch and update npm packages
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    groups:
      # Group routine minor/patch bumps into a single PR
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    reviewers:
      - alexandrupero
    assignees:
      - alexandrupero
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
